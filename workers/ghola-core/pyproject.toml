[project]
name = "ghola-core"
version = "0.1.0"
description = "The pure decisions: where the config is, what a phase sends, what a turn returned"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
# Without this the modules install as `src.turn` and importing them fails. The
# workers would never notice, because they are run as scripts and never
# imported, but the tests import them and would.
sources = ["src"]
