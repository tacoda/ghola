[project]
name = "ghola-policy"
version = "0.1.0"
description = "The four callbacks that carry this repository's ladder. Registers no tools."
requires-python = ">=3.11"
dependencies = [
    "iii-sdk==0.22.1",
    "iii-helpers==0.22.1",
    "ghola-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
