[project]
name = "ghola-audit"
version = "0.1.0"
description = "The append-only record, bundled with ghola and swappable for tacoda/audit-log"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "iii-sdk==0.22.1",
    "iii-helpers==0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
