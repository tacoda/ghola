[project]
name = "ghola-ladder"
version = "0.1.0"
description = "The constraint and capability ladder, bundled with ghola and swappable for tacoda/ladder"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "iii-sdk==0.22.1",
    "iii-helpers==0.22.1",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
