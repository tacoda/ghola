# What ghola knows about each target repository.
#
# Read fresh on every submit, so adding a repo does not mean restarting
# anything. The resolved settings are COPIED onto the job, so a rework months
# later rebuilds the environment the job was born in rather than whatever this
# file says by then.
#
# Precedence: the repo's own entry, then [defaults], then the environment, then
# what is built in.

[defaults]
branch_prefix = "ghola/"
max_revisions = 2

[repos."/Users/tacoda/tacoda/fawlty"]
slug = "tacoda/fawlty"
# Named rather than discovered, so `origin/<base>` in the delivery gate always
# resolves. Discovery from the forge arrives with the draft phase.
base = "main"
# Left empty on purpose for the first run. fawlty's stack is docker-compose and
# bringing it up costs minutes per job; a spec that does not need the app
# running does not need the app running. A spec that DOES needs:
#   prepare = "make up"
#   cleanup = "make down"
prepare = ""
cleanup = ""
