# iii engine configuration — ghola
#
# Stock infrastructure workers only. ghola's own three workers (core, factory,
# policy) self-connect as local host processes: they need git, a forge CLI, and
# the host's credentials, which a managed microVM does not have.
#
# Ports are 3131 (http), 3133 (console) and 49154 (worker manager) rather than
# iii's stock 3111/3113/49134, so a ghola engine runs beside another project's.
#
# Docs: https://iii.dev/docs/how-to/configure-engine
workers:
  # The turn loop. Pinned to 1.8.7 in iii.lock, and the pin is load-bearing:
  # on 1.8.1 a `pre-trigger` hook fired and its `deny` was IGNORED, so the call
  # ran anyway. A ladder mounted there looks wired and enforces nothing.
  - name: harness
  - name: session-manager
  - name: context-manager
  - name: llm-router
  - name: provider-anthropic
  - name: provider-openai
  - name: provider-openai-codex

  # The listener ghola's own workers connect to. Ungoverned: these are the
  # operator's own processes, started from this repository's Makefile.
  - name: iii-worker-manager
    config:
      port: 49154

  # The GOVERNED listener. A second instance of the same worker on its own port,
  # with `gantry::middleware` in front of every call that arrives on it.
  #
  # iii can already run an agent unattended; the open question is letting one
  # SHIP unattended. A promote-class call — anything ending in ::deploy, ::merge,
  # ::publish, ::push, ::apply or ::promote — has to carry a verdict token bound
  # to the exact revision it was minted against, and `gantry::middleware`
  # recomputes the claims from disk rather than trusting the token's own payload.
  #
  # Nothing connects here yet. It exists so the port is reserved and the
  # configuration is reviewable before M5 has something to push, and because a
  # governed listener added on the day you first need it is a governed listener
  # configured in a hurry.
  - name: iii-worker-manager#governed
    config:
      host: 127.0.0.1
      port: 49155
      middleware_function_id: gantry::middleware

  # Blocks what a machine can already prove is unsafe, which is a different
  # question from what a human should decide (approval-gate) and from what a
  # rule can decide (ladder).
  - name: opengantry

  # Serves the dashboard and the JSON endpoints.
  - name: http

  # iii's own console: functions, triggers, queue depth, DLQ, trace waterfalls.
  - name: console
    # 'console': value now lives in the configuration worker at ./config/console.yaml. Edit at runtime via 'iii config set console' (or 'configuration::set'); this block is no longer read.

  - name: queue
    # 'queue': value now lives in the configuration worker at ./config/queue.yaml. Edit at runtime via 'iii config set queue' (or 'configuration::set'); this block is no longer read.

  - name: state
  - name: cron
  - name: shell
  - name: iii-directory
  - name: worktree
  - name: github
  - name: iii-observability
  - name: eval
  - name: approval-gate
  - name: iii-sandbox
    config:
      auto_install: true
      image_allowlist:
        - python
        - node
      default_idle_timeout_secs: 300
      max_concurrent_sandboxes: 32
      default_cpus: 1
      default_memory_mb: 512
  - name: document
  - name: pdf
  - name: storage
  - name: fp
  - name: memory
  - name: claude-code
  - name: codex
  - name: iii-stream
  - name: configuration
  - name: opengantry
